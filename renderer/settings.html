<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <link rel="stylesheet" href="settings.css" />
    <title>DeadlineAura — Impostazioni</title>
  </head>
  <body>
    <div class="titlebar">
      <span class="titlebar-title" data-i18n="settings.title">Impostazioni</span>
      <button
        class="titlebar-close"
        id="btnClose"
        type="button"
        data-i18n-title="common.close"
        title="Chiudi"
        aria-label="Chiudi"
      >
        &#10005;
      </button>
    </div>

    <div class="settings-layout">
      <nav class="settings-nav" id="settingsNav" aria-label="Sezioni">
        <button
          class="nav-item"
          type="button"
          data-tab="sorgenti"
          data-i18n="settings.tabs.sources"
        >
          Collegamenti
        </button>
        <button class="nav-item" type="button" data-tab="ai" data-i18n="settings.tabs.ai">
          AI
        </button>
        <button
          class="nav-item"
          type="button"
          data-tab="notifiche"
          data-i18n="settings.tabs.notifications"
        >
          Notifiche
        </button>
        <button
          class="nav-item"
          type="button"
          data-tab="turno"
          data-i18n="settings.tabs.work_shift"
        >
          Turno
        </button>
        <button
          class="nav-item"
          type="button"
          data-tab="wallpaper"
          data-i18n="settings.tabs.wallpaper"
        >
          Wallpaper
        </button>
        <button class="nav-item" type="button" data-tab="limiti" data-i18n="settings.tabs.ai_usage">
          Limiti Claude/Codex
        </button>
        <button class="nav-item" type="button" data-tab="sidebar" data-i18n="settings.tabs.sidebar">
          Sidebar
        </button>
        <button class="nav-item" type="button" data-tab="ui" data-i18n="settings.tabs.ui">
          Interfaccia
        </button>
        <button
          class="nav-item"
          type="button"
          data-tab="generale"
          data-i18n="settings.tabs.general"
        >
          Generale
        </button>
        <div class="nav-sep" role="separator"></div>
        <button
          class="nav-item"
          type="button"
          data-tab="avanzate"
          data-i18n="settings.tabs.advanced"
        >
          Avanzate
        </button>
      </nav>

      <main class="settings-content" id="settingsContent"></main>
    </div>

    <div class="settings-actions">
      <button class="btn btn--secondary" id="btnReset" data-i18n="settings.reset_section">
        Reset sezione
      </button>
      <div class="actions-spacer"></div>
      <span class="save-feedback" id="saveFeedback" role="status"></span>
      <span class="dirty-indicator" id="dirtyIndicator" hidden>
        &#9679; <span data-i18n="settings.unsaved">Modifiche non salvate</span>
      </span>
      <button class="btn btn--primary" id="btnSave" data-i18n="common.save">Salva</button>
    </div>

    <dialog class="unsaved-dialog" id="unsavedDialog" aria-labelledby="unsavedTitle">
      <h2 id="unsavedTitle" data-i18n="settings.unsaved_title">Hai modifiche non salvate</h2>
      <p data-i18n="settings.unsaved_body">Se esci adesso andranno perse.</p>
      <div class="unsaved-actions">
        <button
          class="btn btn--secondary"
          id="btnKeepEditing"
          type="button"
          data-i18n="settings.keep_editing"
        >
          Continua a modificare
        </button>
        <button
          class="btn btn--danger"
          id="btnDiscard"
          type="button"
          data-i18n="settings.close_without_saving"
        >
          Esci senza salvare
        </button>
        <button
          class="btn btn--primary"
          id="btnSaveAndClose"
          type="button"
          data-i18n="settings.save_and_close"
        >
          Salva ed esci
        </button>
      </div>
    </dialog>

    <script src="i18n-renderer.js"></script>
    <script src="settings-fields.js"></script>
    <script src="settings-shift-fields.js"></script>
    <script src="settings-helpers.js"></script>
    <script src="settings-month-grid.js"></script>
    <script src="settings-sections.js"></script>
    <script src="settings-tab-sources.js"></script>
    <script src="settings-ai-capture.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
