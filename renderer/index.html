<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>DeadlineAura</title>
  </head>
  <body>
    <div class="sidebar">
      <div class="clock-section">
        <button
          class="flyby-toggle"
          id="flybyToggle"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          data-i18n-title="flyby_menu.button_title"
          title="Avvisi call"
          aria-label="Avvisi call"
        >
          <svg class="flyby-cat" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              class="flyby-cat-body"
              d="M3.2 4.2l3.3 3.5a8 6.5 0 0 1 11 0l3.3-3.5-.8 6.4a7 6 0 0 1-1 2.7 7 6 0 0 1-12.9 0 7 6 0 0 1-1-2.7z"
            />
            <circle class="flyby-cat-eye" cx="9.4" cy="10.6" r="1" />
            <circle class="flyby-cat-eye" cx="14.6" cy="10.6" r="1" />
            <line class="flyby-cat-slash" x1="3.6" y1="3.4" x2="20.4" y2="20.6" />
          </svg>
        </button>
        <div class="flyby-menu" id="flybyMenu" role="menu" hidden>
          <div class="flyby-menu-head">
            <div class="flyby-menu-title" data-i18n="flyby_menu.title">Gatto avvisi riunioni</div>
            <div class="flyby-menu-state" id="flybyMenuState"></div>
          </div>
          <button
            class="flyby-menu-item"
            type="button"
            role="menuitem"
            data-action="snooze-1h"
            data-i18n="flyby_menu.snooze_1h"
          >
            Sospendi 1h
          </button>
          <button
            class="flyby-menu-item"
            type="button"
            role="menuitem"
            data-action="snooze-3h"
            data-i18n="flyby_menu.snooze_3h"
          >
            Sospendi 3h
          </button>
          <button
            class="flyby-menu-item"
            type="button"
            role="menuitem"
            data-action="snooze-24h"
            data-i18n="flyby_menu.snooze_24h"
          >
            Sospendi 24h
          </button>
          <button
            class="flyby-menu-item"
            type="button"
            role="menuitem"
            data-action="disable"
            data-i18n="flyby_menu.disable"
          >
            Per sempre
          </button>
          <div class="flyby-menu-sep" role="separator"></div>
          <button
            class="flyby-menu-item flyby-menu-item--reactivate"
            type="button"
            role="menuitem"
            data-action="reactivate"
            data-i18n="flyby_menu.reactivate"
          >
            Riattiva
          </button>
        </div>
        <div class="clock-time" id="clock">--:--</div>
        <div class="clock-date" id="clockDate"></div>
      </div>

      <div class="shift-countdown" id="shiftCountdown" style="display: none">
        <span class="shift-label" id="shiftLabel"></span>
        <span class="shift-time" id="shiftTime">--:--</span>
      </div>

      <div class="urgency-section">
        <div class="urgency-bar-container">
          <div class="urgency-bar-fill" id="urgencyBar"></div>
        </div>
        <div class="urgency-meta">
          <span id="urgencyLabel">--</span>
          <span class="urgency-meta-right">
            <span id="urgencyScore">0.00</span>
            <button
              class="score-help-btn"
              id="scoreHelpBtn"
              type="button"
              data-i18n-title="score_breakdown.button_title"
              title="Perché questo numero?"
              aria-label="Score breakdown"
            >
              ?
            </button>
          </span>
        </div>
        <button
          class="ai-notes-toggle"
          id="aiNotesToggle"
          type="button"
          aria-expanded="false"
          aria-controls="aiNotesPanel"
          hidden
        >
          <span data-i18n="sidebar.ai_notes_toggle">Nota AI e previsione 5 giorni</span>
          <span class="ai-notes-chevron" aria-hidden="true">&#9662;</span>
        </button>
      </div>

      <div class="ai-notes-panel" id="aiNotesPanel">
        <div class="clinical-note" id="clinicalNote"></div>
        <div class="stress-forecast" id="stressForecast"></div>
      </div>

      <div class="score-breakdown-panel" id="scoreBreakdownPanel" hidden></div>

      <div class="first-run-hint" id="firstRunHint" role="status" hidden>
        <p data-i18n="sidebar.first_run_hint">
          Questa è DeadlineAura. Si apre e si chiude cliccando la striscia colorata sul bordo dello
          schermo: il suo colore è il tuo carico di lavoro.
        </p>
        <button class="first-run-ok" id="firstRunOk" type="button" data-i18n="sidebar.first_run_ok">
          Ho capito
        </button>
      </div>

      <div class="divider"></div>

      <div class="tasks-container" id="tasksContainer">
        <div class="empty-state" data-i18n="sidebar.loading">Caricamento dei task...</div>
      </div>

      <div class="sync-problem" id="syncProblem" role="status" hidden>
        <span id="syncProblemText"></span>
        <button
          class="sync-problem-btn"
          id="syncProblemOpen"
          type="button"
          data-i18n="sidebar.sync_problem_open"
        >
          Apri impostazioni
        </button>
      </div>

      <div class="sidebar-footer">
        <button
          class="footer-btn"
          id="btnConfig"
          type="button"
          data-i18n-title="common.config"
          title="Impostazioni"
          aria-label="Impostazioni"
        >
          <svg
            viewBox="0 0 16 16"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="8" cy="8" r="2.3" />
            <path
              d="M8 1.8v1.8M8 12.4v1.8M1.8 8h1.8M12.4 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3"
            />
          </svg>
        </button>
        <button
          class="footer-btn footer-btn--text"
          id="btnLayout"
          type="button"
          data-i18n-title="common.layout"
          data-i18n="common.layout"
          title="Layout"
        >
          Layout
        </button>
        <span class="footer-spacer"></span>
        <span class="sync-status" id="syncStatus" aria-live="polite">--</span>
        <button
          class="footer-btn"
          id="btnSync"
          type="button"
          data-i18n-title="common.sync"
          title="Aggiorna ora"
          aria-label="Aggiorna ora"
        >
          <svg
            viewBox="0 0 16 16"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3" />
          </svg>
        </button>
        <button
          class="footer-btn footer-btn--close"
          id="btnClose"
          type="button"
          data-i18n-title="common.close"
          title="Chiudi"
          aria-label="Chiudi"
        >
          <svg
            viewBox="0 0 16 16"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 4l8 8M12 4l-8 8" />
          </svg>
        </button>
      </div>
    </div>

    <script src="i18n-renderer.js"></script>
    <script src="sidebar-utils.js"></script>
    <script src="shift-countdown.js"></script>
    <script src="sidebar-ui.js"></script>
    <script src="sidebar-onboarding.js"></script>
    <script src="sidebar-score-breakdown.js"></script>
    <script src="sidebar.js"></script>
  </body>
</html>
